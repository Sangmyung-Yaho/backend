spring:
  application:
    name: barocare

  datasource:
    url: jdbc:mysql://localhost:3306/barocare
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000 # 1시간 (ms)
  refresh-expiration: 1209600000 # 14일 (ms)

  servlet:
    multipart:
      # TODO: 파일 크기 제한 기획이 확정되면 실제 정책에 맞게 조정한다. 현재는 Spring 기본값(1MB)이
      # 너무 작아 정상적인 이미지 업로드도 막을 수 있어 넉넉한 값으로만 완화해둔다.
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    local:
      base-dir: uploads
      url-prefix: /uploads