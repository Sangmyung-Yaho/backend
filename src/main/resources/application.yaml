spring:
  # 프로젝트 루트의 .env를 자동으로 읽어들인다(Properties 형식으로 취급). 파일이 없어도(optional) 기동은
  # 계속 진행되며, 그 경우 아래 ${...} 플레이스홀더들은 여전히 값을 요구하므로 관련 에러가 그대로 발생한다.
  # 즉 .env를 만들어두기만 하면 IntelliJ Run Configuration이나 터미널에 환경변수를 별도로 등록할 필요가 없다.
  config:
    import: optional:file:.env[.properties]

  application:
    name: barocare

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/barocare
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    # schema.sql(있다면)을 Hibernate가 스키마를 생성/갱신한 다음에 실행한다 - 아직 테이블이 없는
    # 새 환경에서도 schema.sql이 먼저 돌다가 "테이블 없음" 오류가 나지 않게 하기 위함이다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      # MySQL처럼 임베디드가 아닌 데이터소스에서는 기본값(embedded)이면 schema.sql이 실행되지 않는다.
      # 매 기동마다 실행되지만 schema.sql의 ALTER는 멱등하므로 비용/부작용이 없다.
      mode: always

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          # gpt-4o는 2026-02-16부로 OpenAI API에서 완전히 폐지되어 더 이상 호출할 수 없다(404).
          # 후속 모델인 gpt-5.6 계열(Sol/Terra/Luna) 중 최상위 모델인 Sol로 교체.
          # 필요 시 배포 환경에서 OPENAI_CHAT_MODEL로 override 가능.
          model: ${OPENAI_CHAT_MODEL:gpt-5.6-sol}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      # TODO: 파일 크기 제한 기획이 확정되면 실제 정책에 맞게 조정한다. 현재는 Spring 기본값(1MB)이
      # 너무 작아 정상적인 이미지 업로드도 막을 수 있어 넉넉한 값으로만 완화해둔다.
      max-file-size: 10MB
      max-request-size: 10MB

oauth2:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:your-kakao-client-id}
    client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/kakao/callback}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}
  frontend:
    redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/success}
    # 동적 리다이렉트 허용 주소 목록 (redirect_to 파라미터 화이트리스트, 쉼표 구분)
    allowed-origins: ${OAUTH2_ALLOWED_ORIGINS:http://localhost:3000,https://frontend-five-iota-84.vercel.app}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000 # 1시간 (ms)
  refresh-expiration: 1209600000 # 14일 (ms)

app:
  storage:
    local:
      base-dir: uploads
      url-prefix: /uploads

logging:
  file:
    name: logs/barocare.log

cors:
  frontend-origin: ${CORS_FRONTEND_ORIGIN:}